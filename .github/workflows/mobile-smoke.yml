name: Mobile Chromium smoke check
on:
  push:
    branches: [main]
    paths:
      - 'tests/mobile-smoke.cjs'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without downloading a second browser
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Check live Applications in Android-sized Chromium
        run: node tests/mobile-smoke.cjs
