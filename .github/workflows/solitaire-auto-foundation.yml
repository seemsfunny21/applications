name: Solitaire automatic foundation regression
on:
  push:
    branches: [main]
    paths:
      - 'solitairefunny/index.html'
      - 'tests/solitaire-auto-foundation.cjs'
      - '.github/workflows/solitaire-auto-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  solitaire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Check auto foundation and manual gameplay in Chromium
        run: node tests/solitaire-auto-foundation.cjs
