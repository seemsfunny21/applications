<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="color-scheme" content="dark">
<meta name="description" content="Επτά εφαρμογές και συλλογή παιχνιδιών.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Οι εφαρμογές μου">

<title>Οι εφαρμογές μου</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bg:#071426;--fg:#f4f9ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg)}
.app{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.app-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:45px;padding:calc(4px + env(safe-area-inset-top,0px)) 8px 4px;background:linear-gradient(180deg,#112b49,#091b30);border-bottom:1px solid #416b984f;z-index:3}
.app-toolbar[hidden]{display:none}
.home-back{display:flex;align-items:center;gap:7px;min-height:36px;padding:5px 10px;border:1px solid #4576a1;border-radius:10px;background:#153652;color:#e9f5ff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation}
.home-back svg{width:17px;height:17px}
.active-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700;color:#cee7ff}
.launcher{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 0%,#193d68 0%,#071426 68%);display:flex;align-items:flex-start;justify-content:center}
.launcher[hidden]{display:none}
.launcher-inner{width:min(100%,680px);margin:auto;text-align:center}
.launcher-brand{display:block;width:58px;height:58px;margin:0 auto 13px;border-radius:17px;box-shadow:0 8px 30px #0a7bc93b}
.launcher h1{font-size:clamp(24px,6vw,32px);letter-spacing:-.04em;margin:0 0 23px}
.app-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.app-choice{appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;min-width:0;min-height:112px;padding:13px 3px;background:linear-gradient(145deg,#163c68,#0a2442);border:1px solid #5da8f27a;border-radius:17px;color:#f4f9ff;box-shadow:0 7px 20px #020b1f60,inset 0 1px #ffffff14;cursor:pointer;touch-action:manipulation;transition:filter .15s,transform .15s;font:inherit}
.app-symbol{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#205a89,#10375d);border:1px solid #82c6ff66;color:#a6dcff;box-shadow:0 0 20px #138bdb29}
.app-symbol svg{width:27px;height:27px}
.app-choice strong{font-size:clamp(11px,3.1vw,15px);line-height:1.2;overflow-wrap:anywhere;text-align:center}
.app-choice:active{filter:brightness(1.2);transform:scale(.97)}
.app-choice:focus-visible,.home-back:focus-visible{outline:2px solid #a9deff;outline-offset:2px}
@media(hover:hover){.app-choice:hover{filter:brightness(1.16);transform:translateY(-2px)}}
@media(min-width:761px){.app-choice{min-height:150px}.app-symbol{width:58px;height:58px}.app-symbol svg{width:32px;height:32px}}
@media(max-width:360px){.app-grid{gap:7px}.launcher{padding-left:10px;padding-right:10px}.app-choice{min-height:101px;border-radius:14px}}
@media(max-height:500px) and (orientation:landscape){.launcher{padding-top:10px}.launcher-brand{display:none}.launcher h1{margin-bottom:12px}.app-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.app-choice{min-height:100px}}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#061424;isolation:isolate}
.app-frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#061424}
.app-frame.active{display:block;z-index:1}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  background:#071426;color:#c8d9ec;text-align:center;
  padding:18px;z-index:5;font-size:13px;font-weight:650;pointer-events:none
}
.loading[hidden]{display:none}
.loading span{display:block;width:30px;height:30px;border:3px solid #355c83;border-top-color:#a3d8ff;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.games-hub{
  position:absolute;inset:0;z-index:1;overflow-y:auto;
  display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(ellipse at 50% 5%,#183d6d 0%,#071426 70%);
  padding:12px 12px 28px;color:#f1f8ff;text-align:center
}
.games-hub[hidden]{display:none!important}

.games-shell{width:min(100%,652px);margin:auto}
.games-hero-art{display:block;width:100%;height:clamp(74px,12dvh,112px);object-fit:cover;object-position:center;border:1px solid rgba(111,188,255,.38);border-radius:12px;background:#102e56;box-shadow:0 10px 25px rgba(0,6,26,.32);margin:0 auto 12px}
@media(min-width:761px){.games-hero-art{height:150px}}
.games-kicker{font-size:10px;letter-spacing:.18em;color:#8fcaff;font-weight:900}
.games-heading h1{font-size:clamp(23px,5vw,32px);margin:7px 0 5px}
.games-heading p{font-size:12px;line-height:1.5;color:#bed8f2;margin:0 0 12px}
.games-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(160px,auto);align-items:stretch;gap:9px}
.game-choice{
  display:grid;grid-template-rows:52px minmax(22px,auto) minmax(20px,auto) minmax(27px,auto);
  align-content:center;align-items:center;justify-items:center;gap:5px;
  min-width:0;min-height:160px;height:100%;padding:8px 7px;cursor:pointer;
  background:linear-gradient(145deg,#163c68,#0a2442);
  border:1px solid #5da8f284;border-radius:18px;
  box-shadow:0 9px 28px #020b1f6b,inset 0 1px #ffffff1e;
  color:#f6fbff;touch-action:manipulation;transition:filter .15s,transform .15s
}
.game-choice:active{filter:brightness(1.18);transform:scale(.98)}
.game-choice:focus-visible{outline:3px solid #9ddcff;outline-offset:2px}
.game-mark{height:52px;width:70px;min-width:70px;display:grid;place-items:center;line-height:1.12;
  color:#bde8ff;border:1px solid #84c9ff78;border-radius:14px;
  background:linear-gradient(145deg,#1c507a,#0c335b);
  box-shadow:0 0 26px #138bdb2a}
.sudoku-mark{font-size:15px;font-weight:850;letter-spacing:7px;text-align:center;padding-left:7px;white-space:pre}
.reversi-mark{font-size:22px;font-weight:850;line-height:1;color:#eef8ff;text-shadow:0 0 8px #3cbdff;padding:0;display:grid;place-items:center}
.reversi-pieces{display:grid;grid-template-columns:repeat(2,22px);grid-template-rows:repeat(2,22px);gap:0;place-items:center;width:44px;height:44px}
.reversi-pieces span{display:grid;place-items:center;width:22px;height:22px;line-height:1}
.game-choice strong{font-size:15px;line-height:1.2;display:flex;justify-content:center;align-items:center;min-height:22px;text-wrap:balance;overflow-wrap:anywhere}
.game-choice>span:not(.game-mark){font-size:12px;line-height:1.2;color:#cee5ff;display:flex;align-items:center;justify-content:center;min-height:20px;text-wrap:balance}
.game-choice small{color:#a7c8e6;font-size:10px;line-height:1.35;display:flex;align-items:center;justify-content:center;min-height:27px;text-wrap:balance}
.games-tip{margin:10px 0 0;font-size:11px;color:#a9cae9;line-height:1.5}
@media(max-width:360px){
  .games-options{gap:7px;grid-auto-rows:minmax(146px,auto)}
  .game-choice{grid-template-rows:46px minmax(20px,auto) minmax(18px,auto) minmax(22px,auto);gap:4px;padding:8px 4px;min-height:146px}
  .game-choice strong{font-size:14px}.game-choice small{font-size:9px;min-height:22px}
  .game-mark{height:46px;width:65px;min-width:65px}
}
@media(hover:hover){.game-choice:hover{filter:brightness(1.16);transform:translateY(-2px)}}

.app-orderbar{display:flex;justify-content:center;gap:7px;margin:0 0 10px}.app-orderbar button{font:inherit;font-size:12px;color:#d9ecff;background:#183c60;border:1px solid #5783aa;border-radius:8px;padding:7px 12px;cursor:pointer}.app-orderbar button[aria-pressed=true]{background:#246751;border-color:#76d9b6}.app-orderbar button[hidden],#appOrderHint[hidden]{display:none}#appOrderHint{font-size:12px;color:#c7e4ff;margin:0 0 9px}.app-grid.editing .app-choice{touch-action:none;cursor:grab;user-select:none;border-style:dashed}.app-grid.editing .app-choice.order-picked{outline:2px solid #77e7be;outline-offset:1px;background:#215b52}.app-grid.editing .app-choice.order-target{outline:2px solid #9ed5ff}
</style>
</head>
<body>
<div class="app">
  <header class="app-toolbar" id="appToolbar" hidden><button class="home-back" id="homeBack" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13"/></svg><span id="backLabel">Εφαρμογές</span></button><strong class="active-title" id="activeTitle"></strong></header>
  <main class="stage" id="stage" aria-label="Περιεχόμενο εφαρμογής">
    <section class="launcher" id="launcher" aria-label="Οι εφαρμογές μου"><div class="launcher-inner"><img class="launcher-brand" src="./icon.svg" alt="" width="58" height="58"><h1>Οι εφαρμογές μου</h1><div class="app-orderbar"><button id="editAppOrder" type="button" aria-pressed="false">↕ Αλλαγή σειράς</button><button id="resetAppOrder" type="button" hidden>Επαναφορά</button></div><p id="appOrderHint" hidden role="status">Σύρε ένα κουτάκι στη νέα θέση ή επίλεξε δύο διαδοχικά.</p><div class="app-grid">
          <button class="app-choice" type="button" id="tab-voltes" data-app="voltes" aria-label="Άνοιγμα Ποδηλασία"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="17" r="4"/><circle cx="19" cy="17" r="4"/><path d="m5 17 5-9 5 9H5l4-6h7l3 6M8 8h4m4-4h3"/></svg></span><strong>Ποδηλασία</strong></button>

          <button class="app-choice" type="button" id="tab-reminder" data-app="reminder" aria-label="Άνοιγμα Υπενθυμίσεις"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></span><strong>Υπενθυμίσεις</strong></button>
          <button class="app-choice" type="button" id="tab-Parking" data-app="Parking" aria-label="Άνοιγμα Πάρκινγκ"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg></span><strong>Πάρκινγκ</strong></button>
          <button class="app-choice" type="button" id="tab-kairos" data-app="kairos" aria-label="Άνοιγμα Καιρός"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M9 1v2M2 8H0m4-5L2 1m13 3 2-2M4 19a4 4 0 0 1 0-8 6 6 0 0 1 11 2h3a3 3 0 0 1 0 6Z"/></svg></span><strong>Καιρός</strong></button>
          <button class="app-choice" type="button" id="tab-tvguide" data-app="tvguide" aria-label="Άνοιγμα Πρόγραμμα τηλεόρασης"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="15" rx="3"/><path d="m7 2 5 4 5-4M9 17h6"/></svg></span><strong>Πρόγραμμα τηλεόρασης</strong></button>
          <button class="app-choice" type="button" id="tab-predictions" data-app="predictions" aria-label="Άνοιγμα Προβλέψεις"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/><path d="m12 12 9-9"/></svg></span><strong>Προβλέψεις</strong></button>
          <button class="app-choice" type="button" id="tab-apothiki" data-app="apothiki" aria-label="Άνοιγμα Αποθήκη"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9 12 3l9 6v12H3zM7 21V10h10v11M7 14h10M7 17h10"/></svg></span><strong>Αποθήκη</strong></button>
          <button class="app-choice" type="button" id="tab-games" data-app="games" aria-label="Άνοιγμα Παιχνίδια"><span class="app-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10a4 4 0 0 1 4 4l1 6a3 3 0 0 1-5 2l-3-3h-4l-3 3a3 3 0 0 1-5-2l1-6a4 4 0 0 1 4-4ZM7 10v5m-2.5-2.5h5M16 11h.01M19 14h.01"/></svg></span><strong>Παιχνίδια</strong></button>
        </div></div></section>

    blackjack:{name:'Blackjack',url:'https://seemsfunny21.github.io/games/blackjack/?v=20261123-final-audit-v1'},
    mahjong:{name:'Mahjong Solitaire',url:'https://seemsfunny21.github.io/games/mahjong/?v=20261123-final-audit-v1'},

    puzzle15:{name:'Παζλ 15',url:'https://seemsfunny21.github.io/games/puzzle-15/?v=20261123-final-audit-v1'},
    fallingblocks:{name:'Falling Blocks',url:'https://seemsfunny21.github.io/games/falling-blocks/?v=20261123-final-audit-v1'},
    brickbreaker:{name:'Brick Breaker',url:'https://seemsfunny21.github.io/games/brick-breaker/?v=20261123-final-audit-v1'},
    spaceinvaders:{name:'Space Invaders',url:'https://seemsfunny21.github.io/games/space-invaders/?v=20261123-final-audit-v1'},
    mazechase:{name:'Maze Chase',url:'https://seemsfunny21.github.io/games/maze-chase/?v=20261123-final-audit-v1'},
    frogger:{name:'Frogger',url:'https://seemsfunny21.github.io/games/frogger/?v=20261123-final-audit-v1'},
    wordsearch:{name:'Κρυπτόλεξο',url:'https://seemsfunny21.github.io/games/word-search/?v=20261123-final-audit-v1'},
    hangman:{name:'Κρεμάλα',url:'https://seemsfunny21.github.io/games/hangman/?v=20261123-final-audit-v1'},
    memorymatch:{name:'Memory Match',url:'https://seemsfunny21.github.io/games/memory-match/?v=20261123-final-audit-v1'}
  });
  const GAMES=new Set(['sudokufunny','reversifunny','minesweeperfunny','solitairefunny','chessfunny','tavlifunny','tichufunny','tichufunnyonline','quizfunny','monopolyfunny','battleship','pyramidsolitaire','blackjack','mahjong','flowconnect','puzzle15','fallingblocks','brickbreaker','spaceinvaders','mazechase','frogger','wordsearch','hangman','memorymatch','watersort']);
  const stage=document.getElementById('stage');
  const hub=document.getElementById('gamesHub');
  const GAME_LIST=hub.querySelector('.games-options');
  // On-device favourites: count real game launches, never preloads or tab visits.
  // /applications/ (mobile) and the separate /apps/ desktop site share this key.
  const GAME_USAGE_KEY="applications:game-launch-counts:v1";
  function gameUsage(){
    try{
      const data=JSON.parse(localStorage.getItem(GAME_USAGE_KEY)||"{}");
      return data&&typeof data==="object"&&!Array.isArray(data)?data:{};
    }catch(_){return {};}
  }
  function recordGameLaunch(key){
    const data=gameUsage();
    const previous=Number(data[key]);
    data[key]=(Number.isSafeInteger(previous)&&previous>0?previous:0)+1;
    try{
      localStorage.setItem(GAME_USAGE_KEY,JSON.stringify(data));
    }catch(_){}
    sortGamesByUsage();
  }
  function sortGamesByUsage(){
    const list=GAME_LIST;
    const buttons=[...list.querySelectorAll("[data-game]")];
    const counts=gameUsage();
    // Sort by launch frequency; ties retain the original game order.
    buttons.sort((a,b)=>{
      const ac=Number(counts[a.dataset.game])||0,bc=Number(counts[b.dataset.game])||0;
      return bc-ac||Number(a.dataset.originalIndex)-Number(b.dataset.originalIndex);
    });
    list.append(...buttons);
  }
  function initGameOrdering(){
    [...GAME_LIST.querySelectorAll("[data-game]")].forEach((button,i)=>{
      button.dataset.originalIndex=String(i);
    });
    sortGamesByUsage();
    window.addEventListener("storage",event=>{
      if(event.key===GAME_USAGE_KEY)sortGamesByUsage();
    });
  }
  initGameOrdering();
  const tiles=Array.from(document.querySelectorAll('.app-choice'));
  const launcher=document.getElementById('launcher');
  const toolbar=document.getElementById('appToolbar');
  const backLabel=document.getElementById('backLabel');
  const activeTitle=document.getElementById('activeTitle');
  const loading=document.getElementById('loading');

  // Instant switching: no curtain, animations, or transition timers.
  const frames=new Map(),ready=new Set();
  let current='home',activeGame=null,warmupStarted=false;
  function activeKey(){return current==='home'?null:current==='games'?activeGame:current}
  function activeScreen(){return current==='home'?launcher:current==='games'&&!activeGame?hub:frames.get(activeKey())||null}
  function notifyGameVisibility(){
    for(const key of GAMES){
      const frame=frames.get(key);
      if(!frame?.contentWindow)continue;
      frame.contentWindow.postMessage({
        type:key+':visibility',
        active:activeKey()===key&&document.visibilityState==='visible'
      },location.origin);
    }
  }
  function createFrame(key){
    if(frames.has(key))return frames.get(key);
    const app=apps[key];
    const frame=document.createElement('iframe');
    frame.id='frame-'+key;
    frame.className='app-frame';
    frame.title=app.name;
    // The Tavli iframe cannot request fullscreen; other embedded apps retain
    // their original permission set.
    frame.setAttribute('allow',key==='tavlifunny'
      ? 'geolocation; camera; microphone; clipboard-read; clipboard-write'
      : 'geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen');
    frame.setAttribute('loading','eager');
    frame.referrerPolicy='strict-origin-when-cross-origin';
    frame.addEventListener('load',()=>{
      if(key==='tavlifunny')enforceVisibleTabs();
      ready.add(key);
      if(activeKey()===key)loading.hidden=true;
      if(GAMES.has(key))notifyGameVisibility();
    });
    let frameUrl=key==='apothiki'?app.url+'?v=16b1b76':app.url;
    if(key==='tichufunnyonline'){
      const roomCode=new URLSearchParams(location.search).get('room')?.toUpperCase()||'';
      if(/^[A-HJ-NP-Z2-9]{6}$/.test(roomCode)){
        const roomUrl=new URL(app.url,location.href);
        roomUrl.searchParams.set('room',roomCode);
        frameUrl=roomUrl.href;
      }
    }
    frame.src=frameUrl;
    frames.set(key,frame);
    stage.insertBefore(frame,loading);
    return frame;
  }
  function enforceVisibleTabs(){
    // Fullscreen on the game stage hides the Applications tabs. Exit any
    // lingering fullscreen state whenever Tavli is active (including old tabs).
    const full=document.fullscreenElement;
    if(!full)return;
    if(full===stage || activeKey()==='tavlifunny'){
      if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    }
  }
  document.addEventListener('fullscreenchange',enforceVisibleTabs);
  function show(){
    enforceVisibleTabs();
    const active=activeKey();
    launcher.hidden=current!=='home';
    launcher.setAttribute('aria-hidden',launcher.hidden?'true':'false');
    toolbar.hidden=current==='home';
    backLabel.textContent=activeGame?'Παιχνίδια':'Εφαρμογές';
    activeTitle.textContent=active?apps[active].name:current==='games'?'Παιχνίδια':'';
    if(active)createFrame(active);
    for(const [id,frame] of frames){
      const visible=id===active;
      frame.classList.toggle('active',visible);
      if(visible)frame.removeAttribute('inert');
      else frame.setAttribute('inert','');
      frame.setAttribute('aria-hidden',visible?'false':'true');
    }
    hub.hidden=current!=='games'||!!active;
    hub.setAttribute('aria-hidden',hub.hidden?'true':'false');
    loading.hidden=!active||ready.has(active);
    if(active&&!ready.has(active))loading.textContent='Άνοιγμα '+apps[active].name+'…';
    notifyGameVisibility();
  }
  function select(key){
    if(key!=='home'&&key!=='games'&&(!apps[key]||GAMES.has(key)))return;
    if(key==='games')sortGamesByUsage();
    current=key;
    activeGame=null;
    show();
  }
  function openGame(key){
    if(!GAMES.has(key))return;
    recordGameLaunch(key);
    current='games';
    activeGame=key;
    show();
  }
  function routeUrl(key){
    const url=new URL(location.href);
    if(key==='home'){url.searchParams.delete('app');url.searchParams.delete('room');}
    else{url.searchParams.set('app',key);if(key!=='tichufunnyonline')url.searchParams.delete('room');}
    return url;
  }
  function navigate(key){
    if(key!== 'home' && key!=='games' && !apps[key])return;
    if(key===(activeKey()||current))return;
    history.pushState({app:key},'',routeUrl(key));
    if(GAMES.has(key))openGame(key);
    else select(key);
  }
  const APP_ORDER_KEY="applications:tile-order:v1", appGrid=document.querySelector(".app-grid"), orderBtn=document.getElementById("editAppOrder"), resetBtn=document.getElementById("resetAppOrder"), orderHint=document.getElementById("appOrderHint");
  const defaultOrder=tiles.map(t=>t.dataset.app);
  function normalizeOrder(saved){return [...new Set([...(Array.isArray(saved)?saved.filter(k=>defaultOrder.includes(k)):[]),...defaultOrder])]}
  function applyOrder(order){const map=new Map(tiles.map(t=>[t.dataset.app,t]));appGrid.append(...normalizeOrder(order).map(k=>map.get(k)))}
  try{applyOrder(JSON.parse(localStorage.getItem(APP_ORDER_KEY)||"null"))}catch(_){}
  let editingOrder=false, pickedTile=null, pointerStart=null, suppressClick=false;
  function persistOrder(){try{localStorage.setItem(APP_ORDER_KEY,JSON.stringify([...appGrid.children].map(t=>t.dataset.app)));orderHint.textContent="Η σειρά αποθηκεύτηκε. Σύρε ή επίλεξε δύο κουτάκια."}catch(_){orderHint.textContent="Η σειρά άλλαξε, αλλά δεν αποθηκεύτηκε στον browser."}}
  function clearPicked(){pickedTile=null;tiles.forEach(t=>t.classList.remove("order-picked","order-target"))}
  function moveTile(from,to){if(!from||!to||from===to)return;const list=[...appGrid.children],a=list.indexOf(from),b=list.indexOf(to);if(a<0||b<0)return;list.splice(a,1);list.splice(b,0,from);appGrid.append(...list);clearPicked();persistOrder()}
  function setOrderMode(on){editingOrder=on;clearPicked();pointerStart=null;appGrid.classList.toggle("editing",on);orderBtn.setAttribute("aria-pressed",String(on));orderBtn.textContent=on?"✓ Τέλος":"↕ Αλλαγή σειράς";resetBtn.hidden=!on;orderHint.hidden=!on;orderHint.textContent="Σύρε ένα κουτάκι στη νέα θέση ή επίλεξε δύο διαδοχικά."}
  orderBtn.addEventListener("click",()=>setOrderMode(!editingOrder));
  resetBtn.addEventListener("click",()=>{applyOrder(defaultOrder);clearPicked();persistOrder()});
  tiles.forEach(tile=>tile.addEventListener("click",()=>{if(suppressClick){suppressClick=false;return}if(!editingOrder){navigate(tile.dataset.app);return}if(pickedTile&&pickedTile!==tile){moveTile(pickedTile,tile);return}if(pickedTile===tile){clearPicked();return}clearPicked();pickedTile=tile;tile.classList.add("order-picked")}));
  appGrid.addEventListener("pointerdown",e=>{if(!editingOrder||e.button!==0)return;const tile=e.target.closest(".app-choice");if(tile){suppressClick=false;pointerStart={tile,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};tile.setPointerCapture?.(e.pointerId)}});
  appGrid.addEventListener("pointermove",e=>{const p=pointerStart;if(!p||p.id!==e.pointerId)return;if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>8)p.moved=true;if(!p.moved)return;clearPicked();p.tile.classList.add("order-picked");const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".app-choice");if(target&&target!==p.tile)target.classList.add("order-target")});
  appGrid.addEventListener("pointerup",e=>{const p=pointerStart;if(!p||p.id!==e.pointerId)return;pointerStart=null;if(p.moved){const to=document.elementFromPoint(e.clientX,e.clientY)?.closest(".app-choice");suppressClick=true;moveTile(p.tile,to);clearPicked();setTimeout(()=>{suppressClick=false},400)}});
  appGrid.addEventListener("pointercancel",()=>{pointerStart=null;clearPicked()});
  appGrid.addEventListener("keydown",e=>{if(!editingOrder||!e.altKey||!["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))return;const tile=e.target.closest(".app-choice"),list=[...appGrid.children],i=list.indexOf(tile),cols=getComputedStyle(appGrid).gridTemplateColumns.split(" ").length,delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-cols,ArrowDown:cols}[e.key];if(i>=0&&list[i+delta]){e.preventDefault();moveTile(tile,list[i+delta]);tile.focus()}});
  window.addEventListener("storage",e=>{if(e.key===APP_ORDER_KEY&&!editingOrder){try{applyOrder(JSON.parse(e.newValue||"null"))}catch(_){}}});
  document.getElementById('homeBack').addEventListener('click',()=>navigate(activeGame?'games':'home'));
  window.addEventListener('popstate',()=>{
    const key=new URLSearchParams(location.search).get('app');
    if(GAMES.has(key)){current='games';activeGame=key;show();}
    else select(key==='games'?'games':apps[key]?key:'home');
  });
  hub.querySelectorAll('[data-game]').forEach(btn=>
    btn.addEventListener('click',()=>navigate(btn.dataset.game)));
  document.addEventListener('visibilitychange',()=>{
    notifyGameVisibility();
  });
  window.addEventListener('pagehide',()=>{
    for(const key of GAMES){
      frames.get(key)?.contentWindow?.postMessage({type:key+':visibility',active:false},location.origin);
    }
  });
  const first=new URLSearchParams(location.search).get('app');
  if(GAMES.has(first))openGame(first);
  else select(first==='games'?'games':apps[first]?first:'home');

  // Preload the usual apps only; games open on demand to avoid unnecessary
  // timers and CPU activity while the user is in another project.
  function warm(){
    if(warmupStarted)return;
    warmupStarted=true;
    if(navigator.connection&&navigator.connection.saveData)return;
    const order=['voltes','douleia','reminder','Parking'];
    order.forEach((key,i)=>setTimeout(()=>{
      if(document.visibilityState!=='visible'||frames.has(key))return;
      const frame=createFrame(key);
      if(activeKey()!==key){frame.classList.remove('active');frame.setAttribute('inert','');frame.setAttribute('aria-hidden','true');}
    },900+i*1250));
  }
  window.addEventListener('load',()=>{
    if('requestIdleCallback' in window)requestIdleCallback(warm,{timeout:1800});
    else setTimeout(warm,500);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
      .then(reg=>reg.update().catch(()=>{})).catch(()=>{});
  },{once:true});
})();
