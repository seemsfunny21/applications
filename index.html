<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="color-scheme" content="dark">
<meta name="description" content="Τέσσερις εφαρμογές, μία οθόνη.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Οι εφαρμογές μου">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Οι εφαρμογές μου</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bg:#071426;--fg:#f4f9ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg)}
.app{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.tabs{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));flex:0 0 auto;
  gap:4px;align-items:stretch;min-height:47px;
  padding:calc(5px + env(safe-area-inset-top,0px)) 7px 5px;
  background:linear-gradient(180deg,#112b49,#091b30);
  border-bottom:1px solid #416b984f;box-shadow:0 4px 16px #020a1480;z-index:3
}
.tab{
  appearance:none;min-width:0;min-height:39px;cursor:pointer;
  background:#122c49;border:1px solid transparent;border-radius:11px;
  color:#bed2e8;font-size:clamp(10px,2.65vw,13px);font-weight:750;
  letter-spacing:-.02em;line-height:1.1;text-align:center;
  padding:7px 1px;white-space:nowrap;overflow:hidden;text-overflow:clip;
  -webkit-tap-highlight-color:transparent;
  transition:background .16s,color .16s,border-color .16s;
}
.tab[aria-selected="true"]{
  background:linear-gradient(155deg,#205586,#173b64);
  border-color:#63b6ff93;color:#fff;
  box-shadow:inset 0 1px #ffffff2a,0 0 14px #1784e329;
}
.tab:focus-visible{outline:2px solid #a9deff;outline-offset:-3px}
.tab:active{filter:brightness(1.2)}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#061424}
.app-frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#061424}
.app-frame.active{display:block}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  background:#071426;color:#c8d9ec;text-align:center;
  padding:18px;z-index:1;font-size:13px;font-weight:650;pointer-events:none
}
.loading[hidden]{display:none}
.loading span{display:block;width:30px;height:30px;border:3px solid #355c83;border-top-color:#a3d8ff;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" aria-label="Επιλογή εφαρμογής" role="tablist">
    <button class="tab" id="tab-voltes" type="button" role="tab" aria-controls="frame-voltes" aria-selected="true" data-app="voltes">Ποδηλασία</button>
    <button class="tab" id="tab-douleia" type="button" role="tab" aria-controls="frame-douleia" aria-selected="false" data-app="douleia">Δρομολόγια</button>
    <button class="tab" id="tab-reminder" type="button" role="tab" aria-controls="frame-reminder" aria-selected="false" data-app="reminder">Υπενθυμίσεις</button>
    <button class="tab" id="tab-seemsfunny" type="button" role="tab" aria-controls="frame-seemsfunny" aria-selected="false" data-app="seemsfunny">Pegasus</button>
  </nav>
  <main class="stage" id="stage" aria-label="Περιεχόμενο εφαρμογής">
    <div class="loading" id="loading" role="status" aria-live="polite"><div><span aria-hidden="true"></span>Άνοιγμα Ποδηλασίας…</div></div>
  </main>
</div>
<script>
(() => {
  'use strict';
  const apps = Object.freeze({
    voltes:{name:'Ποδηλασία',url:'https://seemsfunny21.github.io/voltes/'},
    douleia:{name:'Δρομολόγια',url:'https://seemsfunny21.github.io/douleia/'},
    reminder:{name:'Υπενθυμίσεις',url:'https://seemsfunny21.github.io/reminder/'},
    seemsfunny:{name:'Pegasus',url:'https://seemsfunny21.github.io/seemsfunny/'}
  });
  const stage=document.getElementById('stage');
  const tabs=Array.from(document.querySelectorAll('.tab'));
  const loading=document.getElementById('loading');
  const frames=new Map();
  const ready=new Set();
  let current='voltes';
  let warmupStarted=false;
  function createFrame(key){
    if(frames.has(key))return frames.get(key);
    const app=apps[key];
    const frame=document.createElement('iframe');
    frame.id='frame-'+key;
    frame.className='app-frame';
    frame.title=app.name;
    frame.setAttribute('allow','geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen');
    frame.setAttribute('loading','eager');
    frame.referrerPolicy='strict-origin-when-cross-origin';
    frame.addEventListener('load',()=>{
      ready.add(key);
      if(current===key)loading.hidden=true;
    });
    frame.src=app.url;
    frames.set(key,frame);
    stage.insertBefore(frame,loading);
    return frame;
  }
  function select(key){
    if(!apps[key])return;
    current=key;
    for(const tab of tabs){
      const selected=tab.dataset.app===key;
      tab.setAttribute('aria-selected',selected?'true':'false');
    }
    const frame=createFrame(key);
    for(const [id,item] of frames){
      const active=id===key;
      item.classList.toggle('active',active);
      if(active)item.removeAttribute('inert');
      else item.setAttribute('inert','');
      item.setAttribute('aria-hidden',active?'false':'true');
    }
    loading.hidden=ready.has(key);
    if(!loading.hidden)loading.textContent='Άνοιγμα '+apps[key].name+'…';
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.dataset.app)));
  const first=new URLSearchParams(location.search).get('app');
  select(apps[first]?first:'voltes');
  // Avoid keeping every app active on screen. Preload sequentially, in idle time,
  // and stop warm-up when the page is hidden or the connection requests data saving.
  function warm(){
    if(warmupStarted)return;
    warmupStarted=true;
    if(navigator.connection&&navigator.connection.saveData)return;
    const order=['voltes','douleia','reminder','seemsfunny'];
    order.forEach((key,i)=>setTimeout(()=>{
      if(document.visibilityState!=='visible'||frames.has(key))return;
      const frame=createFrame(key);
      if(current!==key){frame.classList.remove('active');frame.setAttribute('inert','');frame.setAttribute('aria-hidden','true');}
    },900+i*1250));
  }
  window.addEventListener('load',()=>{
    if('requestIdleCallback' in window)requestIdleCallback(warm,{timeout:1800});
    else setTimeout(warm,500);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
  },{once:true});
})();
</script>
</body>
</html>
