<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="color-scheme" content="dark">
<meta name="description" content="Επτά καρτέλες εφαρμογών, με δύο παιχνίδια στην ενότητα Παιχνίδια.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Οι εφαρμογές μου">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Οι εφαρμογές μου</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bg:#071426;--fg:#f4f9ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg)}
.app{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.tabs{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:0 0 auto;
  gap:3px;align-items:stretch;min-height:47px;
  padding:calc(5px + env(safe-area-inset-top,0px)) 5px 5px;
  background:linear-gradient(180deg,#112b49,#091b30);
  border-bottom:1px solid #416b984f;box-shadow:0 4px 16px #020a1480;z-index:3
}
.tab{
  appearance:none;min-width:0;min-height:39px;cursor:pointer;
  background:#122c49;border:1px solid transparent;border-radius:10px;
  color:#bed2e8;font-size:clamp(9px,2.45vw,12.5px);font-weight:750;
  letter-spacing:-.035em;line-height:1.1;text-align:center;
  padding:7px 0;white-space:nowrap;overflow:hidden;text-overflow:clip;
  -webkit-tap-highlight-color:transparent;
  transition:background .16s,color .16s,border-color .16s;
}
.tab[aria-selected="true"]{
  background:linear-gradient(155deg,#205586,#173b64);
  border-color:#63b6ff93;color:#fff;
  box-shadow:inset 0 1px #ffffff2a,0 0 14px #1784e329;
}
.tab:focus-visible{outline:2px solid #a9deff;outline-offset:-3px}
.tab:active{filter:brightness(1.2)}
.tab{touch-action:manipulation}
.tab .tab-short{display:none}
@media(max-width:620px){
 .tab .tab-full{display:none}
 .tab .tab-short{display:inline}
}
@media(hover:hover){
 .tab:not([aria-selected="true"]):hover{
  color:#edf8ff;background:#194166;border-color:#396b9a;
  box-shadow:inset 0 1px rgba(255,255,255,.06);
 }
}
@media(max-width:360px){
 .tabs{gap:2px;padding-left:3px;padding-right:3px}
 .tab{font-size:clamp(8px,2.55vw,10px);letter-spacing:-.045em;border-radius:9px}
}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#061424;isolation:isolate}
.app-frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#061424}
.app-frame.active{display:block;z-index:1}
.app-frame.is-leaving{display:block;z-index:3;pointer-events:none}
/* 0.4s vertical black curtain: down for 0.2s, up for 0.2s.
   The old screen is hidden precisely when the curtain covers it entirely. */
.stage.is-shutter-transition{background:#000}
.stage.is-shutter-transition::after{
  content:"";position:absolute;inset:0;z-index:4;background:#000;pointer-events:none;
  animation:vertical-black-curtain 400ms linear both
}
@keyframes vertical-black-curtain{
  0%{transform:translate3d(0,-100%,0)}
  50%{transform:translate3d(0,0,0)}
  100%{transform:translate3d(0,-100%,0)}
}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  background:#071426;color:#c8d9ec;text-align:center;
  padding:18px;z-index:5;font-size:13px;font-weight:650;pointer-events:none
}
.loading[hidden]{display:none}
.loading span{display:block;width:30px;height:30px;border:3px solid #355c83;border-top-color:#a3d8ff;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.games-hub{
  position:absolute;inset:0;z-index:1;overflow-y:auto;
  display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(ellipse at 50% 5%,#183d6d 0%,#071426 70%);
  padding:22px 12px 28px;color:#f1f8ff;text-align:center
}
.games-hub[hidden]{display:none!important}
.games-hub.is-leaving{z-index:3;pointer-events:none}
.games-shell{width:min(100%,680px);margin:auto}
.games-kicker{font-size:10px;letter-spacing:.18em;color:#8fcaff;font-weight:900}
.games-heading h1{font-size:clamp(23px,5vw,32px);margin:7px 0 5px}
.games-heading p{font-size:12px;line-height:1.5;color:#bed8f2;margin:0 0 12px}
.games-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.game-choice{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-width:0;min-height:146px;padding:10px 8px;cursor:pointer;
  background:linear-gradient(145deg,#163c68,#0a2442);
  border:1px solid #5da8f284;border-radius:18px;
  box-shadow:0 9px 28px #020b1f6b,inset 0 1px #ffffff1e;
  color:#f6fbff;touch-action:manipulation;transition:filter .15s,transform .15s
}
.game-choice:active{filter:brightness(1.18);transform:scale(.98)}
.game-choice:focus-visible{outline:3px solid #9ddcff;outline-offset:2px}
.game-mark{height:52px;min-width:70px;display:grid;place-items:center;line-height:1.12;
  color:#bde8ff;border:1px solid #84c9ff78;border-radius:14px;
  background:linear-gradient(145deg,#1c507a,#0c335b);
  box-shadow:0 0 26px #138bdb2a}
.sudoku-mark{font-size:15px;font-weight:850;letter-spacing:7px;text-align:center;padding-left:7px;white-space:pre}
.reversi-mark{font-size:31px;font-weight:850;line-height:1;white-space:pre;color:#eef8ff;text-shadow:0 0 8px #3cbdff}
.game-choice strong{font-size:15px}
.game-choice>span:not(.game-mark){font-size:12px;color:#cee5ff}
.game-choice small{color:#a7c8e6;font-size:10px;line-height:1.35}
.games-tip{margin:10px 0 0;font-size:11px;color:#a9cae9;line-height:1.5}
@media(max-width:360px){
  .games-options{gap:7px}.game-choice{padding:8px 4px;min-height:133px}
  .game-choice strong{font-size:15px}.game-choice small{font-size:9px}
  .game-mark{height:46px;min-width:65px}
}
@media(hover:hover){.game-choice:hover{filter:brightness(1.16);transform:translateY(-2px)}}

</style>
</head>
<body>
<div class="app">
  <nav class="tabs" aria-label="Επιλογή εφαρμογής" role="tablist">
    <button class="tab" id="tab-voltes" type="button" role="tab" aria-label="Ποδηλασία" aria-controls="frame-voltes" aria-selected="true" data-app="voltes"><span class="tab-full">Ποδηλασία</span><span class="tab-short">Ποδηλ.</span></button>
    <button class="tab" id="tab-douleia" type="button" role="tab" aria-label="Δρομολόγια" aria-controls="frame-douleia" aria-selected="false" data-app="douleia"><span class="tab-full">Δρομολόγια</span><span class="tab-short">Δρομολ.</span></button>
    <button class="tab" id="tab-reminder" type="button" role="tab" aria-label="Υπενθυμίσεις" aria-controls="frame-reminder" aria-selected="false" data-app="reminder"><span class="tab-full">Υπενθυμίσεις</span><span class="tab-short">Υπενθ.</span></button>
    <button class="tab" id="tab-seemsfunny" type="button" role="tab" aria-label="Pegasus" aria-controls="frame-seemsfunny" aria-selected="false" data-app="seemsfunny"><span>Pegasus</span></button>
    <button class="tab" id="tab-Parking" type="button" role="tab" aria-label="Parking" aria-controls="frame-Parking" aria-selected="false" data-app="Parking"><span>Parking</span></button>
    <button class="tab" id="tab-kairos" type="button" role="tab" aria-label="Καιρός" aria-controls="frame-kairos" aria-selected="false" data-app="kairos"><span>Καιρός</span></button>
    <button class="tab" id="tab-games" type="button" role="tab" aria-label="Παιχνίδια" aria-controls="gamesHub" aria-selected="false" data-app="games"><span>Παιχνίδια</span></button>
  </nav>
  <main class="stage" id="stage" aria-label="Περιεχόμενο εφαρμογής">
    <section class="games-hub" id="gamesHub" aria-label="Επιλογή παιχνιδιού" hidden>
      <div class="games-shell">
        <div class="games-heading"><span class="games-kicker">ΕΠΙΛΟΓΗ ΠΑΙΧΝΙΔΙΟΥ</span><h1>Παιχνίδια</h1><p>Διάλεξε παιχνίδι. Η πρόοδός σου αποθηκεύεται ξεχωριστά στη συσκευή.</p></div>
        <div class="games-options">
          <button class="game-choice" type="button" data-game="sudokufunny" aria-label="Άνοιγμα SudokuFunny">
            <span class="game-mark sudoku-mark" aria-hidden="true">1 2 3<br>4 5 6<br>7 8 9</span>
            <strong>SudokuFunny</strong><span>Sudoku 9×9</span><small>4 επίπεδα · Σημειώσεις</small>
          </button>
          <button class="game-choice" type="button" data-game="reversifunny" aria-label="Άνοιγμα ReversiFunny">
            <span class="game-mark reversi-mark" aria-hidden="true">● ○<br>○ ●</span>
            <strong>ReversiFunny</strong><span>Reversi 8×8</span><small>Υπολογιστής ή 2 παίκτες</small>
          </button>
          <button class="game-choice" type="button" data-game="minesweeperfunny" aria-label="Άνοιγμα MinesweeperFunny">
            <span class="game-mark" aria-hidden="true">💣</span>
            <strong>MinesweeperFunny</strong><span>Ναρκαλιευτής</span><small>3 επίπεδα · Ρεκόρ χρόνου</small>
          </button>
          <button class="game-choice" type="button" data-game="solitairefunny" aria-label="Άνοιγμα SolitaireFunny">
            <span class="game-mark" aria-hidden="true">♠ ♥<br>♣ ♦</span>
            <strong>SolitaireFunny</strong><span>Πασιέντζα Klondike</span><small>Αναίρεση · Υποδείξεις</small>
          </button>
          <button class="game-choice" type="button" data-game="tavlifunny" aria-label="Άνοιγμα TavliFunny">
            <span class="game-mark" aria-hidden="true">🎲</span>
            <strong>TavliFunny</strong><span>Πόρτες</span><small>Εναντίον υπολογιστή</small>
          </button>
          <button class="game-choice" type="button" data-game="tichufunny" aria-label="Άνοιγμα TichuFunny">
            <span class="game-mark" aria-hidden="true">🃏</span>
            <strong>TichuFunny</strong><span>Τίτσου με AI</span><small>2 ομάδες · 3 αντίπαλοι AI</small>
          </button>
          <button class="game-choice" type="button" data-game="tichufunnyonline" aria-label="Προεπισκόπηση εμφάνισης TichuFunny Online">
            <span class="game-mark" aria-hidden="true">🃏</span>
            <strong>TichuFunny Online</strong><span>Προεπισκόπηση τραπεζιού</span><small>Η σύνδεση παικτών δεν έχει ενεργοποιηθεί ακόμη</small>
          </button>
        </div>
        <p class="games-tip">Για να αλλάξεις παιχνίδι, πάτησε ξανά την καρτέλα «Παιχνίδια».</p>
      </div>
    </section>
    <div class="loading" id="loading" role="status" aria-live="polite"><div><span aria-hidden="true"></span>Άνοιγμα Ποδηλασίας…</div></div>
  </main>
</div>
<script>
(() => {
  'use strict';
  const apps=Object.freeze({
    voltes:{name:'Ποδηλασία',url:'https://seemsfunny21.github.io/voltes/'},
    douleia:{name:'Δρομολόγια',url:'https://seemsfunny21.github.io/douleia/'},
    reminder:{name:'Υπενθυμίσεις',url:'https://seemsfunny21.github.io/reminder/'},
    seemsfunny:{name:'Pegasus',url:'https://seemsfunny21.github.io/seemsfunny/'},
    Parking:{name:'Parking',url:'https://seemsfunny21.github.io/Parking/'},
    kairos:{name:'Καιρός',url:'https://seemsfunny21.github.io/applications/kairos/'},
    sudokufunny:{name:'SudokuFunny',url:'https://seemsfunny21.github.io/sudokufunny/'},
    reversifunny:{name:'ReversiFunny',url:'https://seemsfunny21.github.io/reversifunny/'},
    minesweeperfunny:{name:'MinesweeperFunny',url:'./minesweeperfunny/'},
    solitairefunny:{name:'SolitaireFunny',url:'./solitairefunny/'},
    tavlifunny:{name:'TavliFunny',url:'./tavlifunny/?v=20261120-larger-board'},
    tichufunny:{name:'TichuFunny',url:'./tichufunny/?v=20261120-inline-scores'},
    tichufunnyonline:{name:'TichuFunny Online · Προεπισκόπηση',url:'./tichufunnyonline/?v=20261120-preview'}
  });
  const GAMES=new Set(['sudokufunny','reversifunny','minesweeperfunny','solitairefunny','tavlifunny','tichufunny','tichufunnyonline']);
  const stage=document.getElementById('stage');
  const hub=document.getElementById('gamesHub');
  const tabs=Array.from(document.querySelectorAll('.tab'));
  const loading=document.getElementById('loading');

  // Keep app iframes stationary; animate only the vertical black curtain.
  const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  const frames=new Map(),ready=new Set();
  let current='voltes',activeGame=null,warmupStarted=false;
  let wipeAnimations=[],wipeVersion=0,wipeTimeout=null;
  function activeKey(){return current==='games'?activeGame:current}
  function activeScreen(){return current==='games'&&!activeGame?hub:frames.get(activeKey())||null}
  function clearWipe(){
    ++wipeVersion;
    if(wipeTimeout!==null){clearTimeout(wipeTimeout);wipeTimeout=null;}
    for(const animation of wipeAnimations)animation.cancel();
    wipeAnimations=[];
    stage.classList.remove('is-shutter-transition');
    for(const frame of frames.values())frame.classList.remove('is-leaving');
    hub.classList.remove('is-leaving');
    hub.hidden=!(current==='games'&&!activeGame);
    // If the newly selected iframe is still loading, restore its spinner
    // only after the curtain has fully cleared.
    const active=activeKey();
    loading.hidden=!active||ready.has(active);
  }
  function playVerticalBlackCurtain(outgoing){
    if(stage.clientWidth<100||stage.clientHeight<100)return;
    stage.classList.add('is-shutter-transition');
    const version=++wipeVersion;
    try {
      wipeAnimations=[
        // The outgoing page stays visible during the downward wipe.
        // Halfway through, the black sheet covers it completely and
        // the new page is already behind it, ready for the upward reveal.
        outgoing.animate([
          {opacity:1,offset:0},
          {opacity:1,offset:.499},
          {opacity:0,offset:.501},
          {opacity:0,offset:1}
        ],{duration:400,easing:'linear',fill:'both'})
      ];
    } catch (_) {
      if(wipeVersion===version)clearWipe();
      return;
    }
    // Guard against suspended animation events or interrupted tab switches.
    wipeTimeout=setTimeout(()=>{
      if(wipeVersion===version)clearWipe();
    },700);
    Promise.all(wipeAnimations.map(a=>a.finished.catch(()=>{}))).then(()=>{
      if(wipeVersion===version)clearWipe();
    });
  }
  function notifyGameVisibility(){
    for(const key of GAMES){
      const frame=frames.get(key);
      if(!frame?.contentWindow)return;
      frame.contentWindow.postMessage({
        type:key+':visibility',
        active:activeKey()===key&&document.visibilityState==='visible'
      },location.origin);
    }
  }
  function createFrame(key){
    if(frames.has(key))return frames.get(key);
    const app=apps[key];
    const frame=document.createElement('iframe');
    frame.id='frame-'+key;
    frame.className='app-frame';
    frame.title=app.name;
    // The Tavli iframe cannot request fullscreen; other embedded apps retain
    // their original permission set.
    frame.setAttribute('allow',key==='tavlifunny'
      ? 'geolocation; camera; microphone; clipboard-read; clipboard-write'
      : 'geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen');
    frame.setAttribute('loading','eager');
    frame.referrerPolicy='strict-origin-when-cross-origin';
    frame.addEventListener('load',()=>{
      if(key==='tavlifunny')enforceVisibleTabs();
      ready.add(key);
      if(activeKey()===key)loading.hidden=true;
      if(GAMES.has(key))notifyGameVisibility();
    });
    frame.src=app.url;
    frames.set(key,frame);
    stage.insertBefore(frame,loading);
    return frame;
  }
  function enforceVisibleTabs(){
    // Fullscreen on the game stage hides the Applications tabs. Exit any
    // lingering fullscreen state whenever Tavli is active (including old tabs).
    const full=document.fullscreenElement;
    if(!full)return;
    if(full===stage || activeKey()==='tavlifunny'){
      if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    }
  }
  document.addEventListener('fullscreenchange',enforceVisibleTabs);
  function show(previous=null){
    enforceVisibleTabs();
    // Interrupting a transition is safe even with rapid repeated tab taps.
    clearWipe();
    const active=activeKey();
    for(const tab of tabs){
      tab.setAttribute('aria-selected',tab.dataset.app===current?'true':'false');
    }
    if(active)createFrame(active);
    const incoming=active?frames.get(active):hub;
    // Keep the loader behind the curtain while the incoming iframe finishes loading.
    const animate=!!previous&&previous!==incoming&&
      stage.clientWidth>=100&&stage.clientHeight>=100&&
      !reducedMotion.matches&&document.visibilityState==='visible'&&
      typeof previous.animate==='function'&&typeof incoming.animate==='function';
    for(const [id,frame] of frames){
      const visible=id===active;
      const leaving=animate&&frame===previous;
      frame.classList.toggle('active',visible);
      frame.classList.toggle('is-leaving',leaving);
      if(visible)frame.removeAttribute('inert');
      else frame.setAttribute('inert','');
      frame.setAttribute('aria-hidden',visible?'false':'true');
    }
    hub.hidden=!!active&&!(animate&&previous===hub);
    hub.classList.toggle('is-leaving',animate&&previous===hub);
    hub.setAttribute('aria-hidden',active?'true':'false');
    loading.hidden=animate||!active||ready.has(active);
    if(active&&!ready.has(active))loading.textContent='Άνοιγμα '+apps[active].name+'…';
    notifyGameVisibility();
    if(animate)playVerticalBlackCurtain(previous);
  }
  function select(key){
    if(key!=='games'&&(!apps[key]||GAMES.has(key)))return;
    const previous=activeScreen();
    current=key;
    activeGame=null;
    show(previous);
  }
  function openGame(key){
    if(!GAMES.has(key))return;
    const previous=activeScreen();
    current='games';
    activeGame=key;
    show(previous);
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.dataset.app)));
  hub.querySelectorAll('[data-game]').forEach(btn=>
    btn.addEventListener('click',()=>openGame(btn.dataset.game)));
  document.addEventListener('visibilitychange',()=>{
    notifyGameVisibility();
    if(document.visibilityState==='hidden')clearWipe();
  });
  window.addEventListener('pagehide',()=>{
    for(const key of GAMES){
      frames.get(key)?.contentWindow?.postMessage({type:key+':visibility',active:false},location.origin);
    }
  });
  const first=new URLSearchParams(location.search).get('app');
  if(GAMES.has(first))openGame(first);
  else select(first==='games'?'games':apps[first]?first:'voltes');

  // Preload the usual apps only; games open on demand to avoid unnecessary
  // timers and CPU activity while the user is in another project.
  function warm(){
    if(warmupStarted)return;
    warmupStarted=true;
    if(navigator.connection&&navigator.connection.saveData)return;
    const order=['voltes','douleia','reminder','seemsfunny','Parking'];
    order.forEach((key,i)=>setTimeout(()=>{
      if(document.visibilityState!=='visible'||frames.has(key))return;
      const frame=createFrame(key);
      if(activeKey()!==key){frame.classList.remove('active');frame.setAttribute('inert','');frame.setAttribute('aria-hidden','true');}
    },900+i*1250));
  }
  window.addEventListener('load',()=>{
    if('requestIdleCallback' in window)requestIdleCallback(warm,{timeout:1800});
    else setTimeout(warm,500);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
      .then(reg=>reg.update().catch(()=>{})).catch(()=>{});
  },{once:true});
})();
</script>
</body>
</html>
