<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<meta name="color-scheme" content="dark">
<meta name="description" content="Έξι καρτέλες εφαρμογών και συλλογή παιχνιδιών.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Οι εφαρμογές μου">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Οι εφαρμογές μου</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bg:#071426;--fg:#f4f9ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg)}
.app{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.tabs{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));flex:0 0 auto;
  gap:3px;align-items:stretch;min-height:47px;
  padding:calc(5px + env(safe-area-inset-top,0px)) 5px 5px;
  background:linear-gradient(180deg,#112b49,#091b30);
  border-bottom:1px solid #416b984f;box-shadow:0 4px 16px #020a1480;z-index:3
}
.tab{
  appearance:none;min-width:0;min-height:39px;cursor:pointer;
  background:#122c49;border:1px solid transparent;border-radius:10px;
  color:#bed2e8;font-size:clamp(9px,2.45vw,12.5px);font-weight:750;
  letter-spacing:-.035em;line-height:1.1;text-align:center;
  padding:7px 0;white-space:nowrap;overflow:hidden;text-overflow:clip;
  -webkit-tap-highlight-color:transparent;
  transition:background .16s,color .16s,border-color .16s;
}
.tab[aria-selected="true"]{
  background:linear-gradient(155deg,#205586,#173b64);
  border-color:#63b6ff93;color:#fff;
  box-shadow:inset 0 1px #ffffff2a,0 0 14px #1784e329;
}
.tab:focus-visible{outline:2px solid #a9deff;outline-offset:-3px}
.tab:active{filter:brightness(1.2)}
.tab{touch-action:manipulation}
.tab .tab-short{display:none}
@media(max-width:620px){
 .tab .tab-full{display:none}
 .tab .tab-short{display:inline}
}
@media(hover:hover){
 .tab:not([aria-selected="true"]):hover{
  color:#edf8ff;background:#194166;border-color:#396b9a;
  box-shadow:inset 0 1px rgba(255,255,255,.06);
 }
}
@media(max-width:360px){
 .tabs{gap:2px;padding-left:3px;padding-right:3px}
 .tab{font-size:clamp(8px,2.55vw,10px);letter-spacing:-.045em;border-radius:9px}
}
.stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#061424;isolation:isolate}
.app-frame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#061424}
.app-frame.active{display:block;z-index:1}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  background:#071426;color:#c8d9ec;text-align:center;
  padding:18px;z-index:5;font-size:13px;font-weight:650;pointer-events:none
}
.loading[hidden]{display:none}
.loading span{display:block;width:30px;height:30px;border:3px solid #355c83;border-top-color:#a3d8ff;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.games-hub{
  position:absolute;inset:0;z-index:1;overflow-y:auto;
  display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(ellipse at 50% 5%,#183d6d 0%,#071426 70%);
  padding:12px 12px 28px;color:#f1f8ff;text-align:center
}
.games-hub[hidden]{display:none!important}

.games-shell{width:min(100%,652px);margin:auto}
.games-hero-art{display:block;width:100%;height:clamp(74px,12dvh,112px);object-fit:cover;object-position:center;border:1px solid rgba(111,188,255,.38);border-radius:12px;background:#102e56;box-shadow:0 10px 25px rgba(0,6,26,.32);margin:0 auto 12px}
@media(min-width:761px){.games-hero-art{height:150px}}
.games-kicker{font-size:10px;letter-spacing:.18em;color:#8fcaff;font-weight:900}
.games-heading h1{font-size:clamp(23px,5vw,32px);margin:7px 0 5px}
.games-heading p{font-size:12px;line-height:1.5;color:#bed8f2;margin:0 0 12px}
.games-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(160px,auto);align-items:stretch;gap:9px}
.game-choice{
  display:grid;grid-template-rows:52px minmax(22px,auto) minmax(20px,auto) minmax(27px,auto);
  align-content:center;align-items:center;justify-items:center;gap:5px;
  min-width:0;min-height:160px;height:100%;padding:8px 7px;cursor:pointer;
  background:linear-gradient(145deg,#163c68,#0a2442);
  border:1px solid #5da8f284;border-radius:18px;
  box-shadow:0 9px 28px #020b1f6b,inset 0 1px #ffffff1e;
  color:#f6fbff;touch-action:manipulation;transition:filter .15s,transform .15s
}
.game-choice:active{filter:brightness(1.18);transform:scale(.98)}
.game-choice:focus-visible{outline:3px solid #9ddcff;outline-offset:2px}
.game-mark{height:52px;width:70px;min-width:70px;display:grid;place-items:center;line-height:1.12;
  color:#bde8ff;border:1px solid #84c9ff78;border-radius:14px;
  background:linear-gradient(145deg,#1c507a,#0c335b);
  box-shadow:0 0 26px #138bdb2a}
.sudoku-mark{font-size:15px;font-weight:850;letter-spacing:7px;text-align:center;padding-left:7px;white-space:pre}
.reversi-mark{font-size:22px;font-weight:850;line-height:1;color:#eef8ff;text-shadow:0 0 8px #3cbdff;padding:0;display:grid;place-items:center}
.reversi-pieces{display:grid;grid-template-columns:repeat(2,22px);grid-template-rows:repeat(2,22px);gap:0;place-items:center;width:44px;height:44px}
.reversi-pieces span{display:grid;place-items:center;width:22px;height:22px;line-height:1}
.game-choice strong{font-size:15px;line-height:1.2;display:flex;justify-content:center;align-items:center;min-height:22px;text-wrap:balance;overflow-wrap:anywhere}
.game-choice>span:not(.game-mark){font-size:12px;line-height:1.2;color:#cee5ff;display:flex;align-items:center;justify-content:center;min-height:20px;text-wrap:balance}
.game-choice small{color:#a7c8e6;font-size:10px;line-height:1.35;display:flex;align-items:center;justify-content:center;min-height:27px;text-wrap:balance}
.games-tip{margin:10px 0 0;font-size:11px;color:#a9cae9;line-height:1.5}
@media(max-width:360px){
  .games-options{gap:7px;grid-auto-rows:minmax(146px,auto)}
  .game-choice{grid-template-rows:46px minmax(20px,auto) minmax(18px,auto) minmax(22px,auto);gap:4px;padding:8px 4px;min-height:146px}
  .game-choice strong{font-size:14px}.game-choice small{font-size:9px;min-height:22px}
  .game-mark{height:46px;width:65px;min-width:65px}
}
@media(hover:hover){.game-choice:hover{filter:brightness(1.16);transform:translateY(-2px)}}

</style>
</head>
<body>
<div class="app">
  <nav class="tabs" aria-label="Επιλογή εφαρμογής" role="tablist">
    <button class="tab" id="tab-voltes" type="button" role="tab" aria-label="Ποδηλασία" aria-controls="frame-voltes" aria-selected="true" data-app="voltes"><span class="tab-full">Ποδηλασία</span><span class="tab-short">Ποδηλ.</span></button>
    <button class="tab" id="tab-douleia" type="button" role="tab" aria-label="Δρομολόγια" aria-controls="frame-douleia" aria-selected="false" data-app="douleia"><span class="tab-full">Δρομολόγια</span><span class="tab-short">Δρομολ.</span></button>
    <button class="tab" id="tab-reminder" type="button" role="tab" aria-label="Υπενθυμίσεις" aria-controls="frame-reminder" aria-selected="false" data-app="reminder"><span class="tab-full">Υπενθυμίσεις</span><span class="tab-short">Υπενθ.</span></button>
    <button class="tab" id="tab-Parking" type="button" role="tab" aria-label="Parking" aria-controls="frame-Parking" aria-selected="false" data-app="Parking"><span>Parking</span></button>
    <button class="tab" id="tab-kairos" type="button" role="tab" aria-label="Καιρός" aria-controls="frame-kairos" aria-selected="false" data-app="kairos"><span>Καιρός</span></button>
    <button class="tab" id="tab-games" type="button" role="tab" aria-label="Παιχνίδια" aria-controls="gamesHub" aria-selected="false" data-app="games"><span>Παιχνίδια</span></button>
  </nav>
  <main class="stage" id="stage" aria-label="Περιεχόμενο εφαρμογής">
    <section class="games-hub" id="gamesHub" aria-label="Επιλογή παιχνιδιού" hidden>
      <div class="games-shell">
        <img class="games-hero-art" src="./games-hero.svg" width="900" height="300" alt="Παιχνίδια — μπλε φωτεινή συλλογή με σκάκι, κάρτες και ζάρια" decoding="async">
        <div class="games-heading"><h1>Επιλογή παιχνιδιού</h1><p>Διάλεξε παιχνίδι. Η πρόοδός σου αποθηκεύεται ξεχωριστά στη συσκευή.</p></div>
        <div class="games-options">
          <button class="game-choice" type="button" data-game="sudokufunny" aria-label="Άνοιγμα SudokuFunny">
            <span class="game-mark sudoku-mark" aria-hidden="true">1 2 3<br>4 5 6<br>7 8 9</span>
            <strong>SudokuFunny</strong><span>Sudoku 9×9</span><small>4 επίπεδα · Σημειώσεις</small>
          </button>
          <button class="game-choice" type="button" data-game="reversifunny" aria-label="Άνοιγμα ReversiFunny">
            <span class="game-mark reversi-mark" aria-hidden="true"><span class="reversi-pieces"><span>●</span><span>○</span><span>○</span><span>●</span></span></span>
            <strong>ReversiFunny</strong><span>Reversi 8×8</span><small>Υπολογιστής ή 2 παίκτες</small>
          </button>
          <button class="game-choice" type="button" data-game="minesweeperfunny" aria-label="Άνοιγμα MinesweeperFunny">
            <span class="game-mark" aria-hidden="true">💣</span>
            <strong>MinesweeperFunny</strong><span>Ναρκαλιευτής</span><small>3 επίπεδα · Ρεκόρ χρόνου</small>
          </button>
          <button class="game-choice" type="button" data-game="solitairefunny" aria-label="Άνοιγμα SolitaireFunny">
            <span class="game-mark" aria-hidden="true">♠ ♥<br>♣ ♦</span>
            <strong>SolitaireFunny</strong><span>Πασιέντζα Klondike</span><small>Αναίρεση · Υποδείξεις</small>
          </button>
          <button class="game-choice" type="button" data-game="chessfunny" aria-label="Άνοιγμα ChessFunny Σκάκι">
            <span class="game-mark" aria-hidden="true">♘</span>
            <strong>ChessFunny</strong><span>Σκάκι με AI</span><small>3 δυσκολίες · Υποδείξεις · Αναίρεση</small>
          </button>
          <button class="game-choice" type="button" data-game="tavlifunny" aria-label="Άνοιγμα TavliFunny">
            <span class="game-mark" aria-hidden="true">🎲</span>
            <strong>TavliFunny</strong><span>Πόρτες</span><small>Εναντίον υπολογιστή</small>
          </button>
          <button class="game-choice" type="button" data-game="tichufunny" aria-label="Άνοιγμα TichuFunny">
            <span class="game-mark" aria-hidden="true">🃏</span>
            <strong>TichuFunny</strong><span>Τίτσου με AI</span><small>2 ομάδες · 3 αντίπαλοι AI</small>
          </button>
          <button class="game-choice" type="button" data-game="tichufunnyonline" aria-label="Άνοιγμα TichuFunny Online με φίλους ή υπολογιστές">
            <span class="game-mark" aria-hidden="true">🃏</span>
            <strong>TichuFunny Online</strong><span>Με φίλους ή AI</span><small>4 καρέκλες · δωμάτια με κωδικό</small>
          </button>
          <button class="game-choice" type="button" data-game="monopolyfunny" aria-label="Άνοιγμα MonopolyFunny">
            <span class="game-mark" aria-hidden="true">🎲</span>
            <strong>MonopolyFunny</strong><span>Ακίνητα και στρατηγική</span><small>Εσύ εναντίον AI</small>
          </button>
          <button class="game-choice" type="button" data-game="quizfunny" aria-label="Άνοιγμα QuizFunny">
            <span class="game-mark" aria-hidden="true">🏆</span>
            <strong>QuizFunny</strong><span>Παιχνίδι γνώσεων</span><small>15 ερωτήσεις · 1.000.000 €</small>
          </button>
          <button class="game-choice" type="button" data-game="battleship" aria-label="Άνοιγμα Ναυμαχία">
            <span class="game-mark" aria-hidden="true">🚢</span>
            <strong>Ναυμαχία</strong><span>Στρατηγική</span><small>Εναντίον υπολογιστή</small>
          </button>
          <button class="game-choice" type="button" data-game="pyramidsolitaire" aria-label="Άνοιγμα Pyramid Solitaire">
            <span class="game-mark" aria-hidden="true">🃏</span>
            <strong>Pyramid Solitaire</strong><span>Πασιέντζα</span><small>Ζευγάρια ίσα με 13</small>
          </button>
          <button class="game-choice" type="button" data-game="blackjack" aria-label="Άνοιγμα Blackjack">
            <span class="game-mark" aria-hidden="true">♠️</span>
            <strong>Blackjack</strong><span>Κάρτες</span><small>Παιχνίδι 21</small>
          </button>
          <button class="game-choice" type="button" data-game="mahjong" aria-label="Άνοιγμα Mahjong Solitaire">
            <span class="game-mark" aria-hidden="true">🀄</span>
            <strong>Mahjong Solitaire</strong><span>Πλακίδια</span><small>Ταίριαξε ζευγάρια</small>
          </button>
          <button class="game-choice" type="button" data-game="flowconnect" aria-label="Άνοιγμα Flow Connect">
            <span class="game-mark" aria-hidden="true">🔗</span>
            <strong>Flow Connect</strong><span>Λογική</span><small>Χρωματιστές διαδρομές</small>
          </button>
          <button class="game-choice" type="button" data-game="puzzle15" aria-label="Άνοιγμα Παζλ 15">
            <span class="game-mark" aria-hidden="true">🔢</span>
            <strong>Παζλ 15</strong><span>Λογική</span><small>Αριθμοί σε σειρά</small>
          </button>
          <button class="game-choice" type="button" data-game="fallingblocks" aria-label="Άνοιγμα Falling Blocks">
            <span class="game-mark" aria-hidden="true">🧱</span>
            <strong>Falling Blocks</strong><span>Arcade</span><small>Γραμμές από τουβλάκια</small>
          </button>
          <button class="game-choice" type="button" data-game="brickbreaker" aria-label="Άνοιγμα Brick Breaker">
            <span class="game-mark" aria-hidden="true">🏓</span>
            <strong>Brick Breaker</strong><span>Arcade</span><small>Σπάσε τα τούβλα</small>
          </button>
          <button class="game-choice" type="button" data-game="spaceinvaders" aria-label="Άνοιγμα Space Invaders">
            <span class="game-mark" aria-hidden="true">👾</span>
            <strong>Space Invaders</strong><span>Arcade</span><small>Διαστημική δράση</small>
          </button>
          <button class="game-choice" type="button" data-game="mazechase" aria-label="Άνοιγμα Maze Chase">
            <span class="game-mark" aria-hidden="true">🟡</span>
            <strong>Maze Chase</strong><span>Arcade</span><small>Κυνήγι στον λαβύρινθο</small>
          </button>
          <button class="game-choice" type="button" data-game="frogger" aria-label="Άνοιγμα Frogger">
            <span class="game-mark" aria-hidden="true">🐸</span>
            <strong>Frogger</strong><span>Arcade</span><small>Πέρνα απέναντι</small>
          </button>
          <button class="game-choice" type="button" data-game="wordsearch" aria-label="Άνοιγμα Κρυπτόλεξο">
            <span class="game-mark" aria-hidden="true">🔤</span>
            <strong>Κρυπτόλεξο</strong><span>Λέξεις</span><small>Ελληνικές λέξεις</small>
          </button>
          <button class="game-choice" type="button" data-game="hangman" aria-label="Άνοιγμα Κρεμάλα">
            <span class="game-mark" aria-hidden="true">🔡</span>
            <strong>Κρεμάλα</strong><span>Λέξεις</span><small>Μάντεψε τη λέξη</small>
          </button>
          <button class="game-choice" type="button" data-game="memorymatch" aria-label="Άνοιγμα Memory Match">
            <span class="game-mark" aria-hidden="true">🧠</span>
            <strong>Memory Match</strong><span>Μνήμη</span><small>Βρες τα ζευγάρια</small>
          </button>
        </div>
        <p class="games-tip">Για να αλλάξεις παιχνίδι, πάτησε ξανά την καρτέλα «Παιχνίδια».</p>
      </div>
    </section>
    <div class="loading" id="loading" role="status" aria-live="polite"><div><span aria-hidden="true"></span>Άνοιγμα Ποδηλασίας…</div></div>
  </main>
</div>
<script>
(() => {
  'use strict';
  const apps=Object.freeze({
    voltes:{name:'Ποδηλασία',url:'https://seemsfunny21.github.io/voltes/'},
    douleia:{name:'Δρομολόγια',url:'https://seemsfunny21.github.io/douleia/'},
    reminder:{name:'Υπενθυμίσεις',url:'https://seemsfunny21.github.io/reminder/'},
    Parking:{name:'Parking',url:'https://seemsfunny21.github.io/Parking/'},
    kairos:{name:'Καιρός',url:'https://seemsfunny21.github.io/applications/kairos/'},
    sudokufunny:{name:'SudokuFunny',url:'https://seemsfunny21.github.io/sudokufunny/?v=20261120-native-dialog'},
    reversifunny:{name:'ReversiFunny',url:'https://seemsfunny21.github.io/reversifunny/?v=20261121-tv-ui-v2'},
    minesweeperfunny:{name:'MinesweeperFunny',url:'./minesweeperfunny/?v=20261121-gear-help-v2'},
    solitairefunny:{name:'SolitaireFunny',url:'./solitairefunny/?v=20261122-solitaire-auto-foundations-v10'},
    chessfunny:{name:'ChessFunny',url:'./chessfunny/?v=20261121-gear-clean-v3'},
    tavlifunny:{name:'TavliFunny',url:'./tavlifunny/?v=20261122-mobile-landscape-v3'},
    tichufunny:{name:'TichuFunny',url:'./tichufunny/?v=20261121-mobile-nobanner-v3'},
    tichufunnyonline:{name:'TichuFunny Online',url:'./tichufunnyonline/?v=20261121-mobile-nobanner-v3'},
    quizfunny:{name:'QuizFunny',url:'https://seemsfunny21.github.io/quizfunny/?v=20261121-tv-ui-v2'},
    monopolyfunny:{name:'MonopolyFunny',url:'https://seemsfunny21.github.io/monopolyfunny/?v=20261121-purchase-modal-v22'},
    battleship:{name:'Ναυμαχία',url:'./games/battleship/?v=20261122-games-v1'},
    pyramidsolitaire:{name:'Pyramid Solitaire',url:'./games/pyramid-solitaire/?v=20261122-games-v1'},
    blackjack:{name:'Blackjack',url:'./games/blackjack/?v=20261122-games-v1'},
    mahjong:{name:'Mahjong Solitaire',url:'./games/mahjong/?v=20261122-games-v1'},
    flowconnect:{name:'Flow Connect',url:'./games/flow-connect/?v=20261122-games-v1'},
    puzzle15:{name:'Παζλ 15',url:'./games/puzzle-15/?v=20261122-games-v1'},
    fallingblocks:{name:'Falling Blocks',url:'./games/falling-blocks/?v=20261122-games-v1'},
    brickbreaker:{name:'Brick Breaker',url:'./games/brick-breaker/?v=20261122-games-v1'},
    spaceinvaders:{name:'Space Invaders',url:'./games/space-invaders/?v=20261122-games-v1'},
    mazechase:{name:'Maze Chase',url:'./games/maze-chase/?v=20261122-games-v1'},
    frogger:{name:'Frogger',url:'./games/frogger/?v=20261122-games-v1'},
    wordsearch:{name:'Κρυπτόλεξο',url:'./games/word-search/?v=20261122-games-v1'},
    hangman:{name:'Κρεμάλα',url:'./games/hangman/?v=20261122-games-v1'},
    memorymatch:{name:'Memory Match',url:'./games/memory-match/?v=20261122-games-v1'}
  });
  const GAMES=new Set(['sudokufunny','reversifunny','minesweeperfunny','solitairefunny','chessfunny','tavlifunny','tichufunny','tichufunnyonline','quizfunny','monopolyfunny','battleship','pyramidsolitaire','blackjack','mahjong','flowconnect','puzzle15','fallingblocks','brickbreaker','spaceinvaders','mazechase','frogger','wordsearch','hangman','memorymatch']);
  const stage=document.getElementById('stage');
  const hub=document.getElementById('gamesHub');
  const GAME_LIST=hub.querySelector('.games-options');
  // On-device favourites: count real game launches, never preloads or tab visits.
  // /applications/ (mobile) and the separate /apps/ desktop site share this key.
  const GAME_USAGE_KEY="applications:game-launch-counts:v1";
  function gameUsage(){
    try{
      const data=JSON.parse(localStorage.getItem(GAME_USAGE_KEY)||"{}");
      return data&&typeof data==="object"&&!Array.isArray(data)?data:{};
    }catch(_){return {};}
  }
  function recordGameLaunch(key){
    const data=gameUsage();
    const previous=Number(data[key]);
    data[key]=(Number.isSafeInteger(previous)&&previous>0?previous:0)+1;
    try{
      localStorage.setItem(GAME_USAGE_KEY,JSON.stringify(data));
    }catch(_){}
    sortGamesByUsage();
  }
  function sortGamesByUsage(){
    const list=GAME_LIST;
    const buttons=[...list.querySelectorAll("[data-game]")];
    const counts=gameUsage();
    // Sort by launch frequency; ties retain the original game order.
    buttons.sort((a,b)=>{
      const ac=Number(counts[a.dataset.game])||0,bc=Number(counts[b.dataset.game])||0;
      return bc-ac||Number(a.dataset.originalIndex)-Number(b.dataset.originalIndex);
    });
    list.append(...buttons);
  }
  function initGameOrdering(){
    [...GAME_LIST.querySelectorAll("[data-game]")].forEach((button,i)=>{
      button.dataset.originalIndex=String(i);
    });
    sortGamesByUsage();
    window.addEventListener("storage",event=>{
      if(event.key===GAME_USAGE_KEY)sortGamesByUsage();
    });
  }
  initGameOrdering();
  const tabs=Array.from(document.querySelectorAll('.tab'));
  const loading=document.getElementById('loading');

  // Instant switching: no curtain, animations, or transition timers.
  const frames=new Map(),ready=new Set();
  let current='voltes',activeGame=null,warmupStarted=false;
  function activeKey(){return current==='games'?activeGame:current}
  function activeScreen(){return current==='games'&&!activeGame?hub:frames.get(activeKey())||null}
  function notifyGameVisibility(){
    for(const key of GAMES){
      const frame=frames.get(key);
      if(!frame?.contentWindow)continue;
      frame.contentWindow.postMessage({
        type:key+':visibility',
        active:activeKey()===key&&document.visibilityState==='visible'
      },location.origin);
    }
  }
  function createFrame(key){
    if(frames.has(key))return frames.get(key);
    const app=apps[key];
    const frame=document.createElement('iframe');
    frame.id='frame-'+key;
    frame.className='app-frame';
    frame.title=app.name;
    // The Tavli iframe cannot request fullscreen; other embedded apps retain
    // their original permission set.
    frame.setAttribute('allow',key==='tavlifunny'
      ? 'geolocation; camera; microphone; clipboard-read; clipboard-write'
      : 'geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen');
    frame.setAttribute('loading','eager');
    frame.referrerPolicy='strict-origin-when-cross-origin';
    frame.addEventListener('load',()=>{
      if(key==='tavlifunny')enforceVisibleTabs();
      ready.add(key);
      if(activeKey()===key)loading.hidden=true;
      if(GAMES.has(key))notifyGameVisibility();
    });
    let frameUrl=app.url;
    if(key==='tichufunnyonline'){
      const roomCode=new URLSearchParams(location.search).get('room')?.toUpperCase()||'';
      if(/^[A-HJ-NP-Z2-9]{6}$/.test(roomCode)){
        const roomUrl=new URL(app.url,location.href);
        roomUrl.searchParams.set('room',roomCode);
        frameUrl=roomUrl.href;
      }
    }
    frame.src=frameUrl;
    frames.set(key,frame);
    stage.insertBefore(frame,loading);
    return frame;
  }
  function enforceVisibleTabs(){
    // Fullscreen on the game stage hides the Applications tabs. Exit any
    // lingering fullscreen state whenever Tavli is active (including old tabs).
    const full=document.fullscreenElement;
    if(!full)return;
    if(full===stage || activeKey()==='tavlifunny'){
      if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    }
  }
  document.addEventListener('fullscreenchange',enforceVisibleTabs);
  function show(){
    enforceVisibleTabs();
    const active=activeKey();
    for(const tab of tabs){
      tab.setAttribute('aria-selected',tab.dataset.app===current?'true':'false');
    }
    if(active)createFrame(active);
    for(const [id,frame] of frames){
      const visible=id===active;
      frame.classList.toggle('active',visible);
      if(visible)frame.removeAttribute('inert');
      else frame.setAttribute('inert','');
      frame.setAttribute('aria-hidden',visible?'false':'true');
    }
    hub.hidden=!!active;
    hub.setAttribute('aria-hidden',active?'true':'false');
    loading.hidden=!active||ready.has(active);
    if(active&&!ready.has(active))loading.textContent='Άνοιγμα '+apps[active].name+'…';
    notifyGameVisibility();
  }
  function select(key){
    if(key!=='games'&&(!apps[key]||GAMES.has(key)))return;
    if(key==='games')sortGamesByUsage();
    current=key;
    activeGame=null;
    show();
  }
  function openGame(key){
    if(!GAMES.has(key))return;
    recordGameLaunch(key);
    current='games';
    activeGame=key;
    show();
  }
  tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.dataset.app)));
  hub.querySelectorAll('[data-game]').forEach(btn=>
    btn.addEventListener('click',()=>openGame(btn.dataset.game)));
  document.addEventListener('visibilitychange',()=>{
    notifyGameVisibility();
  });
  window.addEventListener('pagehide',()=>{
    for(const key of GAMES){
      frames.get(key)?.contentWindow?.postMessage({type:key+':visibility',active:false},location.origin);
    }
  });
  const first=new URLSearchParams(location.search).get('app');
  if(GAMES.has(first))openGame(first);
  else select(first==='games'?'games':apps[first]?first:'voltes');

  // Preload the usual apps only; games open on demand to avoid unnecessary
  // timers and CPU activity while the user is in another project.
  function warm(){
    if(warmupStarted)return;
    warmupStarted=true;
    if(navigator.connection&&navigator.connection.saveData)return;
    const order=['voltes','douleia','reminder','seemsfunny','Parking'];
    order.forEach((key,i)=>setTimeout(()=>{
      if(document.visibilityState!=='visible'||frames.has(key))return;
      const frame=createFrame(key);
      if(activeKey()!==key){frame.classList.remove('active');frame.setAttribute('inert','');frame.setAttribute('aria-hidden','true');}
    },900+i*1250));
  }
  window.addEventListener('load',()=>{
    if('requestIdleCallback' in window)requestIdleCallback(warm,{timeout:1800});
    else setTimeout(warm,500);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
      .then(reg=>reg.update().catch(()=>{})).catch(()=>{});
  },{once:true});
})();
</script>
